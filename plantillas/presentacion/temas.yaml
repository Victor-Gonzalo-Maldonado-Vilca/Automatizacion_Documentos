# ============================================================================
#  TEMAS DE COLOR PARA LAS DIAPOSITIVAS
#  Se elige en presentacion.yaml con `tema: <nombre>` o con --tema <nombre>.
#  Para un tema propio, copia uno y cambia los colores.
#  En diapositivas.yaml también puedes cambiar solo algunos colores:
#      colores: { primario: "#0B5394" }
#
#  primario     -> barras, acentos, viñetas, encabezados de tabla
#  oscuro       -> fondo de portada inferior, separadores de sección y cierre
#  acento       -> detalles secundarios (números de sección, resaltados)
#  texto        -> texto principal
#  texto_suave  -> subtítulos, pies, numeración
#  fondo        -> fondo de las diapositivas
#  fondo_alt    -> paneles, tarjetas y filas alternas de tablas
#  texto_claro  -> texto sobre fondos oscuros
# ============================================================================

